// ---------- Sun & moon position (compact port of the SunCalc formulas) ----------
const RAD = Math.PI / 180, DAY_MS = 86400000, OBL = RAD * 23.4397;

function rng(seed) { let a = seed >>> 0; return () => { a += 0x6D2B79F5; let t = a; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

  const g = cv.getContext('2d');

  const bx = W / 2, by = W + 0.03 * px;                       // all stalks start from one point at the bottom

  const leaves = [

function makeFicus() {
  const W = 1024, px = W / PLANT.size, cv = document.createElement('canvas'); cv.width = cv.height = W;

      x = nx; y = ny;

      if (i > (depth ? 0 : 3)) for (const side of [1, -1]) {

// Frost for the window scene, drawn once. The picture covers the window from its top edge down to FROST_BOTTOM (metres);
// one pixel is about a millimetre. 1 = clear glass, 0 = frosted. Frost is a grainy matte film that has crept in from the
// bottom and the corners of each pane; along its ragged border small ice crystals grow into the clear glass:
// straight needles that branch at 60 degrees, a few centimetres long.
const FROST_BOTTOM = -1.0;
function makeFrost() {
  const W = 716, H = 1420, R = rng(41);

    const P = new Float32Array(4096).map(() => R());

    return (x, y) => { const xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi, u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
      return (h(xi, yi) * (1 - u) + h(xi + 1, yi) * u) * (1 - v) + (h(xi, yi + 1) * (1 - u) + h(xi + 1, yi + 1) * u) * v; };

  const F = new Float32Array(W * H).fill(-1e3), E = new Float32Array(W * H).fill(1e3);   // E: distance to the frame

    const o = k * 97.3;
    for (let y = Math.max(0, y1); y < Math.min(H, y2); y++) for (let x = Math.max(0, Math.floor(x1)); x < Math.min(W, x2); x++) {
      const dB = y2 - y, dT = y - y1, dL = x - x1, dR = x2 - x;
      // how far the frost reaches from each edge, varying along the edge; most from the bottom, more in the corners
      // every reach is a share of the pane's smaller side, so a small pane gets a narrow band, not a frosted middle
      const s0 = Math.min(x2 - x1, Math.min(H, y2) - y1);
      const bottom = s0 * (0.09 + 0.10 * vn(x / 90 + o, 3)) - dB;
      const top = s0 * (0.012 + 0.022 * vn(x / 70 + o, 7)) - dT;

      f += 12 * (vn(x / 22 + o, y / 22) - 0.5) + 8 * (vn(x / 6, y / 6 + o) - 0.5);      // ragged border

  for (let i = 0; i < W * H; i++) {

    const grain = 0.80 + 0.40 * R() * (0.6 + 0.4 * vn(x / 3, y / 3));                               // sugary texture

// How each photo is cut: "top" = hangs from above (otherwise grows from below), "flip" = mirrored,
// "x" = where it stands across the window (0 = at its left edge, where a plant cut by the photo's left side must be).
const PLANTS = [{ flip: true, x: 0 }, { top: true, x: 0.42 }, { x: 0 }, { top: true, x: 0.10 }, { x: 0 }];
const PLANT_FILL = 0.8;      // share of the square's height the nearest layer takes
// One photo becomes three depth layers in the three colour channels; the further ones are nudged and resized a little.
function photoLayers(img, P) {
  const W = 1024, cv = document.createElement('canvas'); cv.width = cv.height = W;
  const g = cv.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, W, W);
  const tmp = document.createElement('canvas'); tmp.width = tmp.height = W; const t = tmp.getContext('2d');
  [['#0ff', 1, 0], ['#f0f', 0.86, 0.06], ['#ff0', 1.12, 0.03]].forEach(([ink, zoom, dx]) => {
    const h = PLANT_FILL * W * zoom, w = h * img.width / img.height, x = dx * W, y = P.top ? 0 : W - h;
    t.globalCompositeOperation = 'source-over'; t.fillStyle = '#fff'; t.fillRect(0, 0, W, W);
    t.save(); if (P.flip) { t.translate(x + w, y); t.scale(-1, 1); } else t.translate(x, y);
    t.drawImage(img, 0, 0, w, h); t.restore();
    t.globalCompositeOperation = 'lighten'; t.fillStyle = ink; t.fillRect(0, 0, W, W);
    g.globalCompositeOperation = 'multiply'; g.drawImage(tmp, 0, 0);
  });
  return cv;
}
let photoShown = 0;                                   // which photo is in the texture now (0 = none yet)
function decodePhoto(i) {
  return new Promise((done, fail) => {
    const img = new Image();
    img.onload = () => done(img);
    img.onerror = () => fail(new Error(`plant photo ${i} could not be decoded`));
    img.src = PHOTOS[i - 1];
  });
}
// puts a decoded photo on the GPU at once, without waiting
function photoNow(i, img) {
  gl.activeTexture(gl.TEXTURE4); gl.bindTexture(gl.TEXTURE_2D, photoTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, photoLayers(img, PLANTS[i - 1]));
  gl.generateMipmap(gl.TEXTURE_2D); photoShown = i;
}
function usePhoto(i) {
  if (photoShown === i) return Promise.resolve();

}

float ign(vec2 p){ return fract(52.9829189 * fract(dot(p, vec2(0.06711056, 0.00583715)))); }
float hash(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float vnoise(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.0-2.0*f);
  return mix(mix(hash(i), hash(i+vec2(1,0)), f.x), mix(hash(i+vec2(0,1)), hash(i+vec2(1,1)), f.x), f.y); }
vec2 disc(int i, float rot){ float r = sqrt((float(i) + 0.5) / float(N)), a = float(i) * 2.39996323 + rot; return r * vec2(cos(a), sin(a)); }

// Блики. Each gap in the crown throws an image of the sun: an ellipse stretched along the light.
// The crown itself stays where it is; "drift" lets the spots slide only a little as the light turns.
float crown(sampler2D m, vec2 p, vec3 s, float dist, float drift, float tile, float seed, float rot){
  float z = max(s.z, 0.42), l = length(s.xy);
  vec2 ax = l > 1e-4 ? s.xy / l : vec2(0.0, 1.0);
  vec2 q = p + drift * s.xy / z;
  // the crown is never quite still: over a day its gaps slowly open, close and wander, and return by midnight
  q += 0.22 * vec2(cos(uPhase + seed * 2.1), sin(uPhase * 2.0 + seed * 1.3));
  q += 0.045 * vec2(sin(q.y * 2.6 + uPhase * 3.0 + seed) + 0.5 * sin(q.x * 6.1 - uPhase * 5.0),
                    cos(q.x * 2.2 - uPhase * 2.0 + seed) + 0.5 * cos(q.y * 5.3 + uPhase * 4.0));
  // wind: the crown sways as a whole, slowly and in gusts, and its leaves flutter fast and small, so the gaps open and close.
  // A gust crosses the wall rather than hitting all of it at once; every branch has its own phase.
  if (uWindLeaves > 0.0){
    float tt = uT - dot(p, vec2(0.22, 0.06));
    float gust = 0.3 + 0.7 * vnoise(vec2(tt * 0.12 + seed * 7.0, seed * 3.1)); gust *= gust;
    float br = vnoise(q * 0.8 + seed * 5.0) * 6.2832;
    float wd = max(uWindLeaves, 0.06 + 0.5 * uWindLeaves);       // leaves never stand quite still: light air still stirs a crown
    float A = wd * (0.35 + 0.65 * gust), f = 0.6 + 8.0 * wd;
    q += A * 0.055 * vec2(sin(tt * f + br), 0.45 * sin(tt * f * 0.77 + br * 1.3));
    float fl = tt * (1.2 + 15.0 * wd);           // leaves flutter faster in stronger wind
    q += A * 0.040 * (vec2(vnoise(q * 11.0 + vec2(fl, seed * 9.0)), vnoise(q * 11.0 + vec2(seed * 4.0, fl * 0.87))) - 0.5);
  }
  float R = SUN_R * uSrc * dist, a = R / (z * z), b = R / z;
  float texel = uTex / tile;
  float lod = log2(max(max(sqrt(3.14159 * a * b / float(N)) * texel, uWallH / uRes.y * texel), 1.0));
  float sum = 0.0;
  for (int i = 0; i < N; i++){ vec2 e = disc(i, rot);
    sum += textureLod(m, (q + ax * (a * e.x) + vec2(-ax.y, ax.x) * (b * e.y)) / tile + seed * 0.37, lod).r; }
  return sum / float(N);
}
float dapples(vec2 p, vec3 s, float rot){
  return crown(uM1, p, s, 7.0, 0.14, 3.70, 3.0, rot) * crown(uM0, p, s, 6.0, 0.11, 2.60, 2.0, rot + 2.1);
}

// One water drop on the glass, seen as its shadow: an uneven dark blob, heavier at the bottom,
// with a small bright point where the drop focuses the light. d = offset from its centre, r = size.
float drop(vec2 d, float r, float seed){
  if (r < 1e-4) return 1.0;
  float ang = atan(d.y, d.x);
  float rr = r * (1.0 + 0.16 * sin(ang * 3.0 + seed * 6.3) + 0.09 * sin(ang * 5.0 + seed * 11.0));
  float dist = length(d * vec2(1.0, d.y > 0.0 ? 1.25 : 0.85));                   // narrower on top, fuller below
  float body = 1.0 - smoothstep(0.75 * rr, rr, dist);
  float rim = smoothstep(0.45 * rr, 0.9 * rr, dist) * body;
  float spark = 1.0 - smoothstep(0.0, 0.30 * r, length(d - vec2(0.12 * r, -0.30 * r)));
  return (1.0 - 0.55 * body - 0.35 * rim) + 1.3 * spark * body;
}
// Rain on the glass: a mist of tiny drops, a few large ones that grow and then run down, and the trails they leave.
// Everything is placed by a fixed lottery per cell of glass, so nothing jumps between frames.
float rainGlass(vec2 w, vec4 win){
  float T = 1.0;
  vec2 g = w / 0.013, id = floor(g);                                             // mist
  for (int j = -1; j <= 1; j++) for (int i = -1; i <= 1; i++){
    vec2 c = id + vec2(float(i), float(j));
    if (hash(c + 1.9) < 0.35) continue;
    vec2 d = w - (c + 0.15 + 0.7 * vec2(hash(c), hash(c + 17.3))) * 0.013;
    float r = 0.0016 + 0.0036 * hash(c + 4.2) * hash(c + 8.4);
    T *= 1.0 - 0.70 * (1.0 - smoothstep(0.4 * r, r, length(d)));
  }
  g = w / 0.052; id = floor(g);                                                  // large drops
  for (int j = -1; j <= 1; j++) for (int i = -1; i <= 1; i++){
    vec2 c = id + vec2(float(i), float(j));
    if (hash(c + 5.1) < 0.42) continue;
    float a = hash(c), b = hash(c + 17.3), life = fract(hash(c + 9.7) + uWT * (0.6 + 0.8 * a));
    float r = 0.016 * (0.40 + 0.60 * b * b) * smoothstep(0.0, 0.25, life) * (1.0 - smoothstep(0.88, 1.0, life));
    T *= drop(w - (c + 0.2 + 0.6 * vec2(a, b)) * 0.052, r, a + b);
  }
  float col = floor(w.x / 0.070);                                                // one possible trail per column of glass
  if (hash(vec2(col, 3.3)) > 0.40){
    float a = hash(vec2(col, 1.0)), life = fract(hash(vec2(col, 7.7)) + uWT * 0.45);
    float x0 = (col + 0.25 + 0.5 * a) * 0.070 + 0.0045 * sin(w.y * 31.0 + a * 6.3) + 0.0025 * sin(w.y * 83.0 + a * 17.0);
    float top = mix(-0.20, win.w, hash(vec2(col, 4.4))), tip = top - 0.60 * life;
    float fade = 1.0 - smoothstep(0.82, 1.0, life), on = step(tip, w.y) * step(w.y, top) * fade;
    float wd = 0.0052 * (0.55 + 0.9 * vnoise(vec2(col * 3.1, w.y * 45.0))) * (0.5 + 0.5 * smoothstep(top, top - 0.10, w.y));
    float dx = abs(w.x - x0);
    T = T * (1.0 - 0.72 * on * (1.0 - smoothstep(0.5 * wd, wd, dx))) + 0.45 * on * (1.0 - smoothstep(0.0, 0.35 * wd, dx));
    float seg = floor(w.y / 0.034), by = (seg + 0.5) * 0.034;                    // beads left behind along the trail
    if (hash(vec2(col, seg)) > 0.55 && by > tip && by < top)
      T *= mix(1.0, drop(vec2(w.x - x0, w.y - by), 0.006 + 0.005 * hash(vec2(seg, col)), a + seg), fade);
    T *= mix(1.0, drop(vec2(w.x - x0, w.y - tip), 0.015, a), fade);            // the drop at the head of the trail
  }
  return clamp(T, 0.0, 1.8);
}
// Frost. The window keeps its shape; a thin lumpy layer of snow lies on the crossbar, and frost has grown over the glass:
// a grainy rim along every edge with feathery crystals reaching inwards. Frosted glass passes about half the light.
float snowGlass(vec2 w, vec4 win, float barX, float barY){
  float T = 1.0;
  if (w.y > barY){                                         // a thin, lumpy layer of snow on the crossbar
    float up = abs(w.x - barX) - 0.024, side = min(w.x - win.x, win.z - w.x);
    float lump = 0.010 + 0.016 * vnoise(vec2(w.x * 21.0, 2.0)) + 0.010 * vnoise(vec2(w.x * 55.0, 9.0))
               + 0.014 * exp(-max(up, 0.0) / 0.025) + 0.012 * exp(-side / 0.025);
    float top = barY + 0.020 + lump;
    T *= smoothstep(top - 0.009, top + 0.004, w.y);
  }
  return T;
}

// Растение / Жалюзи. What the window lets through at a point of its plane (metres).
float windowMask(vec2 w, vec4 win){
  if (w.x < win.x || w.x > win.z || w.y < win.y || w.y > win.w) return 0.0;
  if (uScene == 2)                                             // thin slats, two cords, one upright of the frame
    return step(0.28, fract((w.y - win.y) / 0.030))
         * step(0.0035, abs(w.x - mix(win.x, win.z, 0.20))) * step(0.0035, abs(w.x - mix(win.x, win.z, 0.80)))
         * step(0.016, abs(w.x - mix(win.x, win.z, 0.40)));
  float barX = mix(win.x, win.z, 0.34), barY = mix(win.y, win.w, 0.74);
  float frame = step(0.024, abs(w.x - barX)) * step(0.020, abs(w.y - barY));
  if (uWeather == 1) frame *= rainGlass(w, win);
  if (uWeather == 2) frame *= snowGlass(w, win, barX, barY);
  return frame;
}
// For a point on our wall, look back towards the light: first through the window in the side wall,
// then at the plant standing outside it. The plant is further away, so its shadow is larger and softer.
vec3 room(vec2 p, vec3 s, vec4 win, float rot){
  vec3 a = normalize(cross(s, vec3(0.0, 1.0, 0.0))), b = cross(s, a);
  float D = p.x - uCorner, t0 = D / max(-s.x, 1e-3), px = 1.2 * uWallH / uRes.y;
  float Rw = max(SUN_R * uSrc * (uScene == 2 ? 0.55 : uWeather > 0 ? 0.55 : 1.4), px / max(t0, 1e-3));
  float sw = 0.0;
  for (int i = 0; i < N; i++){ vec2 e = disc(i, rot);
    vec3 d = normalize(s + (a * e.x + b * e.y) * Rw);
    float t = D / max(-d.x, 1e-3);
    sw += windowMask(vec2(t * d.z, p.y + t * d.y), win); }
  // plant layers: the further a layer stands from the wall, the softer and paler its shadow
  float plant = 1.0;
  for (int L = 0; L < 3; L++){
    if (L >= uLayers) break;
    float Dp = D + uDepth[L], Rp = SUN_R * uSrc * (uScene == 2 ? 0.7 + 0.5 * float(L) : 0.6 + 0.55 * float(L));
    vec2 sh = (uDepth[L] - uDepth.x) * vec2(1.19, 0.30);
    vec4 rc = uPlantRect + vec4(sh, sh);
    float lod = log2(max(Dp / max(-s.x, 1e-3) * Rp * uTex / (rc.z - rc.x) / sqrt(float(N)) * 1.6, 1.0));
    float sp = 0.0;
    for (int i = 0; i < N; i++){ vec2 e = disc(i, rot + 1.7 * float(L + 1));
      vec3 d = normalize(s + (a * e.x + b * e.y) * Rp);
      float t = Dp / max(-d.x, 1e-3);
      vec2 n = (vec2(t * d.z, p.y + t * d.y) - rc.xy) / (rc.zw - rc.xy);
      vec3 tx = textureLod(uPlant, vec2(n.x, 1.0 - n.y), lod).rgb;
      sp += (n.x < 0.0 || n.x > 1.0 || n.y < 0.0 || n.y > 1.0) ? 1.0 : (L == 0 ? tx.r : L == 1 ? tx.g : tx.b); }
    float lo = uScene == 2 ? (L == 0 ? 0.16 : L == 1 ? 0.45 : 0.66) : (L == 0 ? 0.12 : L == 1 ? 0.36 : 0.58);
    plant *= mix(lo, 1.0, sp / float(N));
  }
  // frost: where the glass is frosted, light is scattered: the wall gets a dim, even glow and the plant's shadow is lost
  float clear = 1.0;
  if (uWeather == 2){
    vec2 wf = vec2(t0 * s.z, p.y + t0 * s.y);
    vec2 nf = vec2((wf.x - win.x) / (win.z - win.x), (win.w - wf.y) / (win.w - uFrostBottom));
    float tpm = float(textureSize(uFrost, 0).x) / (win.z - win.x);
    if (nf.x >= 0.0 && nf.x <= 1.0 && nf.y >= 0.0 && nf.y <= 1.0)
      clear = textureLod(uFrost, nf, log2(max(t0 * Rw * tpm * 0.2, 1.0))).r;
  }
  float v = sw / float(N) * (clear * plant + (1.0 - clear) * 0.24);
  // the patch is brightest in its middle, and it lends a faint glow to the wall around it
  vec2 w0 = vec2(t0 * s.z, p.y + t0 * s.y), n0 = (w0 - win.xy) / (win.zw - win.xy) - 0.5;
  vec2 out2 = max(max(win.xy - w0, w0 - win.zw), 0.0);
  return vec3(v * (1.0 - 0.30 * clamp(dot(n0, n0) * 2.0, 0.0, 1.0)), exp(-dot(out2, out2) / 0.16), 0.0);
}

float bumps(vec2 p, mat2 tw){ return vnoise(p * 75.0) * 0.30 + vnoise(tw * p * 170.0) * 0.35 + vnoise(tw * tw * p * 360.0) * 0.35; }

// Вода. Sunlight bent by a rippled water surface: where neighbouring rays cross, the wall gets a bright line.
// "reach" is how far the bent rays travel; taking it slightly different per colour gives the rainbow edges.
float caustic(vec2 p, vec3 s, float reach){
  float z = max(s.z, 0.42), l = length(s.xy);
  vec2 ax = l > 1e-4 ? s.xy / l : vec2(0.0, 1.0);
  vec2 q = p + 0.12 * s.xy / z;
  q -= ax * dot(q, ax) * (1.0 - z) * 0.6;                      // ripples stretch along the light when it comes at a slant
  float ph = uPhase + uT * (0.05 + 2.25 * uWind);                 // live motion: the water keeps moving, faster in wind
  q += 0.07 * vec2(sin(q.y * 3.1 + 1.0) + 0.5 * sin(q.x * 5.3 + ph), cos(q.x * 2.7 + 2.0) + 0.5 * cos(q.y * 4.7 - ph));
  float a = 0.0, b = 0.0, c = 0.0;
  for (int i = 0; i < 7; i++){
    float fi = float(i), ang = fi * 2.39996 + 0.6, f = 9.0 * pow(1.30, fi);
    vec2 k = vec2(cos(ang), sin(ang));
    float w = 0.62 / (1.0 + 0.28 * fi) * sin(f * dot(k, q) + fi * 1.7 + ph * (1.0 + mod(fi, 3.0)));
    a += w * k.x * k.x; b += w * k.x * k.y; c += w * k.y * k.y;
  }
  float det = (1.0 - reach * a) * (1.0 - reach * c) - reach * reach * b * b;
  return 1.0 / sqrt(det * det + 0.03 + uCalm);
}

void main(){
  vec2 fc = gl_FragCoord.xy;
  if (uMirror) fc.x = uRes.x - fc.x;
  vec2 p = (fc - 0.5 * uRes) / uRes.y * uWallH;               // position on the wall, metres
  float rot = ign(fc) * 6.2831853;
  vec3 light = uAmb;
  float sun = 0.5;
  if (uScene == 3){
    vec3 k = vec3(caustic(p, uL1, 2.3), caustic(p, uL1, 2.4), caustic(p, uL1, 2.52));
    k = min(k, 6.0) * 0.17;
    float pool = 0.75 + 0.25 * sin(p.x * 2.3 + 0.7) * sin(p.y * 1.9 - 0.4);     // calmer and livelier areas
    light += uC1 * (0.22 + k * pool);
  } else if (uC1.r + uC1.g + uC1.b > 0.002){
    vec3 r = uScene == 0 ? vec3(dapples(p * 1.3, uL1, rot), 0.0, 0.0) : room(p, uL1, uWin1, rot);
    float v = r.x; sun = v;
    light += uC1 * v + uC1 * vec3(0.10, 0.04, -0.03) * (v * (1.0 - v) * 4.0);   // warm edge where light meets shade
    light += uC1 * r.y * 0.08;
    if (uScene == 1){                                           // a faint second streak, as if reflected off something in the room
      vec2 q = p - vec2(0.30 * uWallH * uRes.x / uRes.y, -0.20); q = mat2(0.64, -0.77, 0.77, 0.64) * q;
      light += uC1 * 0.13 * exp(-q.x * q.x / 0.0016 - q.y * q.y / 0.03);
    }
  }
  vec2 edge = p / (0.5 * uWallH * vec2(uRes.x / uRes.y, 1.0));
  light *= 1.0 - 0.24 * smoothstep(0.35, 1.25, length(edge));                    // the wall darkens towards its corners
  vec3 col = uWall * light;
  // plaster: small bumps catch the light on the side facing it, fine vertical strokes from the trowel, speckle on top
  mat2 tw = mat2(0.80, 0.60, -0.60, 0.80);
  vec2 lit2 = normalize(uL1.xy + vec2(1e-4, 0.0)), dq = lit2 * 0.0012;
  float h0 = bumps(p, tw), relief = (bumps(p + dq, tw) - h0) * 0.5;
  float strokes = vnoise(vec2(p.x * 260.0, p.y * 9.0)) - 0.5;
  col *= 1.0 + ((h0 - 0.5) * 0.045 + relief * (0.30 + 0.50 * sun) + strokes * 0.02) * uRough;
  col = pow(clamp(col, 0.0, 1.0), vec3(1.0 / 2.2));
  col += ((hash(fc + 3.7) - 0.5) * 0.028 + (hash(floor(fc / 2.0) + 9.1) - 0.5) * 0.010) * min(uRough, 1.4);   // grain, fine and coarse
  o = vec4(col, 1.0);
}`;

let U = {}, ready = false;
function initGL() {
  const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; };
  const prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, VERT)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FRAG));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);
  const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'a'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  for (const n of ['uRes','uWallH','uTex','uSrc','uCorner','uPhase','uCalm','uT','uWind','uWindLeaves','uWeather','uWT','uDepth','uLayers','uPlantRect','uScene','uL1','uC1','uWin1','uWall','uAmb','uRough','uM0','uM1','uPlant','uFrost','uFrostBottom','uMirror'])
    U[n] = gl.getUniformLocation(prog, n);
  const SIZE = 1024;
  [[makeCrown(CROWN[0], SIZE), 'uM0', gl.REPEAT], [makeCrown(CROWN[1], SIZE), 'uM1', gl.REPEAT], [makePlant(), null, gl.CLAMP_TO_EDGE], [makeFicus(), null, gl.CLAMP_TO_EDGE], [document.createElement('canvas'), null, gl.CLAMP_TO_EDGE], [makeFrost(), 'uFrost', gl.CLAMP_TO_EDGE]]
    .forEach(([img, name, wrap], i) => {
      const tex = gl.createTexture(); gl.activeTexture(gl.TEXTURE0 + i); gl.bindTexture(gl.TEXTURE_2D, tex);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
      gl.generateMipmap(gl.TEXTURE_2D);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, wrap); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, wrap);
      if (name) gl.uniform1i(U[name], i);
    });
  photoTex = gl.createTexture(); gl.activeTexture(gl.TEXTURE4); gl.bindTexture(gl.TEXTURE_2D, photoTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([255, 255, 255, 255]));
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.uniform1f(U.uFrostBottom, FROST_BOTTOM);
  gl.uniform1f(U.uTex, SIZE); gl.uniform1f(U.uWallH, WALL_H); 
  ready = true;
}

// ---------- Light: from the sun's position to colours and directions ----------
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const mix3 = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
const hexLin = (h) => [1, 3, 5].map(i => Math.pow(parseInt(h.slice(i, i + 2), 16) / 255, 2.2));

// ---------- Wall colour: the six approved walls, or one of the person's own made in the picker ----------
// Colour maths in OKLab, so that moving across the picker changes colour evenly.
function lin2lab([r, g, b]) {
  const l = Math.cbrt(0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b), m = Math.cbrt(0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b),
        s = Math.cbrt(0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b);
  return [0.2104542553 * l + 0.7936177850 * m - 0.0040720468 * s, 1.9779984951 * l - 2.4285922050 * m + 0.4505937099 * s, 0.0259040371 * l + 0.7827717662 * m - 0.8086757660 * s];
}
function lab2lin([L, a, b]) {
  const l = (L + 0.3963377774 * a + 0.2158037573 * b) ** 3, m = (L - 0.1055613458 * a - 0.0638541728 * b) ** 3, s = (L - 0.0894841775 * a - 1.2914855480 * b) ** 3;
  return [4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s, -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s, -0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s];
}
const lch2lin = (L, C, h) => lab2lin([L, C * Math.cos(h * RAD), C * Math.sin(h * RAD)]);
const inGamut = (c) => c.every(v => v >= -1e-4 && v <= 1.0001);
// how colourful a wall may get at this lightness and hue: never past what the screen can show, never acid
function chromaCap(L, h) { let lo = 0, hi = 0.37; for (let i = 0; i < 16; i++) { const m = (lo + hi) / 2; if (inGamut(lch2lin(L, m, h))) lo = m; else hi = m; } return Math.min(0.105, lo * 0.85); }
const linHex = (c) => '#' + c.map(v => Math.round(255 * Math.pow(clamp(v, 0, 1), 1 / 2.2)).toString(16).padStart(2, '0')).join('');

// the person's own wall: lightness, picker position, own shade colour or none, strength of light 0..1, texture 0..2
const custom = { L: 0.88, x: 0.5, y: 0.8, shade: null, k: 0.1, rough: 1 };
function customWall() {

    const warm = clamp(0.5 + 0.5 * Math.cos((h - 65) * RAD), 0, 1);   // pale or cool ones keep bluish skylight in the shade

function currentWall() { return state.wall >= 0 ? { lin: hexLin(WALLS[state.wall].c), amb: WALLS[state.wall].amb } : customWall(); }
// start the picker from an approved wall, so the first touch changes it only a little
function customFrom(i) {

const state = { ms: 0, minutes: 720, cloud: 0, scene: 0, plant: 2, winPlant: 2, weather: 0, wall: 0, mirror: false };   // ms = the moment, minutes = local time of day
// "Жалюзи" always has the palm (5); "Окно" offers the drawn bush (0), the hanging branch (2) or the palm (5)
// only the two window scenes show a plant, so the others never decode a photo
function pickPlant() { state.plant = state.scene === 2 ? 5 : state.winPlant; return state.plant && (state.scene === 1 || state.scene === 2) ? usePhoto(state.plant) : Promise.resolve(); }
const stateDate = () => new Date(state.ms);

// Where a light stands for the current scene. alt = real height above the horizon,

  // standing on its sill (or hanging from its top) at the plant's own place across it.
  const photo = (win, bottom, top, tall, left = 0) => {
    const P = PLANTS[state.plant - 1], side = tall * Math.min(1, 0.55 + 0.45 * S) / PLANT_FILL;
    const x0 = win[0] + P.x * (win[2] - win[0]) - 0.004 - left * side, y0 = P.top ? top + 0.03 - side : bottom - 0.03;
    return [x0, y0, x0 + side, y0 + side];

    const win = [0.10 * S, -1.0, 0.81 * S, 0.42], left = 0.15 * S / Math.tan(phi);   // left = where the screen's edge cuts the window
    return { dir, win, plant: state.plant ? photo([left - 0.02, 0, win[2], 0], -0.40, 0.42, 0.62)

  }

  if (state.plant) return { dir, win, plant: photo(win, win[1], win[3], 0.80, 0.09) };

}
function lighting(wallW) {
  const s = sky(stateDate().getTime(), PLACE.lat, PLACE.lng), c = state.cloud, deg = s.alt / RAD;
  const hemi = PLACE.lat >= 0 ? 1 : -1, H0 = clamp(s.H0, 0.2, Math.PI - 0.2);

  const room = currentWall().amb, lum = (room[0] + room[1] + room[2]) / 3;

// ---------- Drawing: one frame, only when something changed ----------
// Live motion (update 1.1): handed over by the app with every komorebi.render(): uT in seconds and the two
// wind strengths. 0 = the still picture.
const motion = { t: 0, wind: 0, windLeaves: 0 };
let last = null, hasState = false;
function invalidate() { if (ready && hasState) draw(); }   // a resized canvas is blank, so it is redrawn at once
function resize() {
  const scale = Math.min(window.devicePixelRatio || 1, 1.5);
  const w = Math.max(1, Math.round(canvas.clientWidth * scale)), h = Math.max(1, Math.round(canvas.clientHeight * scale));
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  invalidate();
}
function draw() {
  const wallW = WALL_H * canvas.width / canvas.height, L = last = lighting(wallW);
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.uniform2f(U.uRes, canvas.width, canvas.height);
  const wx = state.scene === 1 ? state.weather : 0;
  gl.uniform1i(U.uWeather, wx); gl.uniform1f(U.uWT, state.minutes * (wx === 2 ? 0.11 : 1 / 25));
  gl.uniform1i(U.uScene, state.scene); gl.uniform1i(U.uMirror, state.mirror ? 1 : 0); gl.uniform1f(U.uPhase, 6.2832 * state.minutes / 1440); gl.uniform1f(U.uCalm, 0.12 * state.cloud); gl.uniform1i(U.uPlant, state.plant ? 4 : state.scene === 1 ? 3 : 2); gl.uniform3f(U.uDepth, ...(state.plant ? [0, 0.12, 0.30] : state.scene === 1 ? [0.15, 0.45, 0.90] : [PLANT.behind, 1.0, 0])); gl.uniform1i(U.uLayers, state.scene === 1 || state.plant ? 3 : 1); gl.uniform1f(U.uSrc, L.src);

// ---------- The one entry point the app calls ----------
// komorebi.render({ time, utcOffset, lat, lng, scene, wall, plant, cloud, weather })
//   time       the moment, milliseconds since 1970-01-01 UTC
//   utcOffset  local time at the place minus UTC at that moment, in minutes (Berlin in summer: 120)
//   lat, lng   the place, degrees
//   scene      0 dapples, 1 window, 2 blinds, 3 water
//   wall       0–5 an approved wall, -1 the own wall described by `custom`
//   custom     optional: { L, x, y, shade: { x, y } or null, k, rough }, the prototype's own wall.
//              Its texture `rough` (0–2) is used for every wall, approved ones too, as in the prototype.
//   plant      plant for the window scene: 0 drawn bush, 2 hanging branch, 5 palm (blinds always use 5)
//   cloud      0–1
//   weather    0 clear, 1 rain, 2 frost; shown only in the window scene, the others ignore it
//   mirror     optional (update 1.3): true draws the frame as its mirror image (Light from: Right).
//              The app sends it only for the window and the blinds.
//   preview    optional: width in pixels of a small copy of the frame to return as a JPEG data URL
//   snapshot   optional: the same, a second copy at another width (the app's copy for the system wallpaper)
//   motion     optional (update 1.1): { t, wind, windLeaves }, the shader's uT, uWind, uWindLeaves. Left out: still.
//   from, mix  optional: while one motion turns into another, the frame is `from` with `motion` drawn over it at `mix` (0–1).
//              The small copies (preview, snapshot) are always of the still frame.
// Draws exactly one frame. Resolves with the sun's height in degrees once the frame is on the canvas.
let initError = null, queue = Promise.resolve();
async function renderNow(v) {
  if (!gl) throw new Error('WebGL 2 is not available');
  if (!ready) throw new Error('drawing could not start: ' + initError);
  PLACE.lat = +v.lat; PLACE.lng = +v.lng;
  state.ms = +v.time;
  state.minutes = (((+v.time / 60000 + +v.utcOffset) % 1440) + 1440) % 1440;
  state.scene = clamp(Math.round(+v.scene), 0, 3);
  setWall(v);
  state.winPlant = [0, 2, 5].includes(+v.plant) ? +v.plant : 2;
  state.cloud = clamp(+v.cloud || 0, 0, 1);
  state.weather = [0, 1, 2].includes(+v.weather) ? +v.weather : 0;
  state.mirror = v.mirror === true || v.mirror === 1;   // a Swift true may arrive as 1

  document.documentElement.style.setProperty('--wall', linHex(W.lin.map((v, i) => v * W.amb[i])));
  hasState = true;
  const scale = Math.min(window.devicePixelRatio || 1, 1.5);
  const w = Math.max(1, Math.round(canvas.clientWidth * scale)), h = Math.max(1, Math.round(canvas.clientHeight * scale));
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }

  const moving = now.t !== 0 || now.wind !== 0 || now.windLeaves !== 0 || from !== null;

  const copies = +v.preview > 0 || +v.snapshot > 0;

  if (+v.preview > 0) out.preview = smallCopy(+v.preview);
  if (+v.snapshot > 0) out.snapshot = smallCopy(+v.snapshot);

const STILL = { t: 0, wind: 0, windLeaves: 0 };
function readMotion(m) {
  const n = (x) => Number.isFinite(+x) ? +x : 0;

// One moving frame: `now`, or `from` with `now` drawn over it at `mix` (a crossfade of two motions).
function drawMotion(now, from, mix) {

// A small copy of the frame just drawn. It must be taken in the same task as draw(), before the canvas

function smallCopy(width) {
  const w = Math.max(1, Math.round(width)), h = Math.max(1, Math.round(width * canvas.height / canvas.width));

  small.width = w; small.height = h;

// The wall: approved (0–5) or own (-1). Every number of `custom` is kept within the prototype's ranges.
function setWall(v) {
  state.wall = +v.wall === -1 ? -1 : clamp(Math.round(+v.wall), 0, WALLS.length - 1);
  const c = v.custom;
  if (!c) return;
  const unit = (x, d) => Number.isFinite(+x) ? clamp(+x, 0, 1) : d;
  Object.assign(custom, {
    L: unit(c.L, 0.88), x: unit(c.x, 0.5), y: unit(c.y, 0.8), k: unit(c.k, 0.1),
    rough: Number.isFinite(+c.rough) ? clamp(+c.rough, 0, 2) : 1,

// ---------- Small pictures of every scene, for one wall ----------
// komorebi.thumbs({ wall, custom }) draws a small picture of every scene and a close-up of each plant's shadow
// in the window scene, for that wall, and then the current frame again. All of it happens in one go, before
// the canvas next reaches the screen, so the wall never shows any of these pictures.
// They are always drawn at the same moment and size, so the pictures of an own wall look like those of the
// approved walls (tools/make-thumbnails.swift makes those with this same function when the app is built).
// Resolves with JPEG data URLs: dapples, blinds, water, window-<plant>, plant-<plant> for plants 0, 2, 5.
const THUMB = {
  time: Date.UTC(2026, 3, 20, 9, 0, 0), utcOffset: 120, lat: 52.52, lng: 13.405,   // Berlin, 20 April 2026, 11:00, clear
  frame: [1920, 1243], scale: 1.5,     // the frame as drawn on a 1920×1243 Retina screen, then made small
  width: 240,                          // twice the widest frame of the scene film, sharp on Retina
  // where each plant's shadow falls in the window scene at that moment, in points of the 1920×1243 frame;
  // 120×96 pixels, twice the plant row's small frames
  crops: { 0: [40, 560, 600, 480], 2: [140, 330, 560, 448], 5: [0, 780, 580, 463] }, plant: [120, 96],

async function thumbsNow(v) {
  if (!gl) throw new Error('WebGL 2 is not available');
  if (!ready) throw new Error('drawing could not start: ' + initError);
  // the plant photos are decoded first: once drawing starts nothing may wait, or the canvas would reach the screen
  const photos = { 2: await decodePhoto(2), 5: await decodePhoto(5) };
  const was = { state: { ...state }, place: { ...PLACE }, custom: { ...custom }, motion: { ...motion }, w: canvas.width, h: canvas.height };
  const out = {};
  try {
    Object.assign(motion, STILL);                       // the small pictures are always still
    setWall(v);
    PLACE.lat = THUMB.lat; PLACE.lng = THUMB.lng;
    state.ms = THUMB.time; state.minutes = (((THUMB.time / 60000 + THUMB.utcOffset) % 1440) + 1440) % 1440;
    state.cloud = 0; state.weather = 0;
    state.mirror = false;                               // the app turns the small pictures over itself
    canvas.width = Math.round(THUMB.frame[0] * THUMB.scale); canvas.height = Math.round(THUMB.frame[1] * THUMB.scale);
    const shot = (scene, plant) => {
      state.scene = scene; state.winPlant = plant; state.plant = scene === 2 ? 5 : plant;
      if (state.plant && photoShown !== state.plant) photoNow(state.plant, photos[state.plant]);

    const full = document.createElement('canvas'), close = document.createElement('canvas');
    full.width = THUMB.frame[0]; full.height = Math.round(THUMB.frame[0] * canvas.height / canvas.width);
    close.width = THUMB.plant[0]; close.height = THUMB.plant[1];

      out[`window-${p}`] = smallCopy(THUMB.width);
      const f = full.getContext('2d'), g = close.getContext('2d'), [x, y, w, h] = THUMB.crops[p];
      f.imageSmoothingEnabled = g.imageSmoothingEnabled = true; f.imageSmoothingQuality = g.imageSmoothingQuality = 'high';
      f.drawImage(canvas, 0, 0, full.width, full.height);
      g.drawImage(full, x, y, w, h, 0, 0, close.width, close.height);
      out[`plant-${p}`] = close.toDataURL('image/jpeg', 0.9);
    }
    shot(2, 2); out.blinds = smallCopy(THUMB.width);
    shot(0, 2); out.dapples = smallCopy(THUMB.width);
    shot(3, 2); out.water = smallCopy(THUMB.width);

    // back to the frame on the wall, still in the same go
    Object.assign(state, was.state); Object.assign(PLACE, was.place); Object.assign(custom, was.custom); Object.assign(motion, was.motion);
    canvas.width = was.w; canvas.height = was.h;

    if (hasState) draw();
  }
  return out;
}

window.komorebi = {
  render(v) { const run = queue.then(() => renderNow(v)); queue = run.catch(() => {}); return run; },
  thumbs(v) { const run = queue.then(() => thumbsNow(v)); queue = run.catch(() => {}); return run; },
  // colour of each approved wall in the shade, as the prototype paints its colour buttons
  wallShades() { return WALLS.map((w, i) => { const l = hexLin(w.c); return linHex(l.map((v, k) => v * w.amb[k])); }); },
};

if (gl) {
  try { initGL(); } catch (err) { initError = err.message; }
  new ResizeObserver(resize).observe(canvas);
}

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hidamari</title>
<!-- The card of the Windows app (design/panel/). Built on the working panel of the site (site/src/), which is not
     changed: the parts are copied here and the rest (own-wall picker, settings, first launch, Quit) added after the
     Mac app's code. Texts come from the app (Strings.cs, checked against Strings.swift), the colour maths from
     wall.html itself (Card.cs takes it out of the page at start), the pictures from the app's thumbs. -->
<link rel="stylesheet" href="card.css">
</head>
<body>
<div class="slot" id="slot">
<section class="card" id="card">
  <div class="sky" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <div class="main" id="main">
    <!-- the very first launch: open at login? (design/panel/first-launch). Once answered, never again. -->
    <div class="fold" id="firstFold"><div class="fold-inner first" id="first">
      <span class="caption" id="firstQuestion"></span>
      <div class="halves gap" id="firstHalves">
        <button type="button" class="half" id="firstNotNow"></button>
        <button type="button" class="half" id="firstOpen"></button>
      </div>
      <div class="line"></div>
    </div></div>

    <div class="top" id="top">
      <div class="top-left">
        <!-- Berlin until stage 3: no arrow, no search, a click does nothing -->
        <span class="place" id="place"></span>
        <span class="time" id="time" aria-hidden="true"></span>
        <div class="arc" id="arc" tabindex="0" role="slider" aria-valuemin="0" aria-valuemax="1439">
          <svg width="236" height="112" viewBox="0 0 236 112" aria-hidden="true">
            <defs>
              <radialGradient id="sunGlow"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" class="tint-stop"/><stop offset="1" class="tint-stop" stop-opacity="0"/></radialGradient>
              <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
            </defs>
            <line x1="0" x2="236" id="horizon" class="horizon"/>
            <polyline id="below1" class="below"/>
            <polyline id="below2" class="below"/>
            <polyline id="aboveGlow" class="above-glow" filter="url(#soft)"/>
            <polyline id="aboveLine" class="above-line"/>
            <text id="riseText" class="sun-time" text-anchor="end"></text>
            <text id="setText" class="sun-time" text-anchor="start"></text>
            <circle id="realSun" r="4" class="real-sun"/>
            <g id="sun">
              <line x1="0" x2="0" y1="14" id="drop" class="drop"/>
              <circle r="26" class="halo halo-big" filter="url(#soft)"/>
              <circle r="18" class="halo" filter="url(#soft)" opacity="0.6"/>
              <circle r="12" fill="url(#sunGlow)"/>
              <circle r="5.5" id="sunCore" class="sun-core"/>
            </g>
          </svg>
        </div>
      </div>
      <div class="walls" id="walls"></div>
    </div>

    <div class="film" id="film"></div>
    <div class="fold" id="plantsFold"><div class="fold-inner plants-row" id="plants"></div></div>

    <!-- the own-wall picker (design/panel/own-wall-picker), folded away while closed -->
    <div class="fold picker-fold" id="pickerFold"><div class="fold-inner picker" id="picker">
      <div class="pad" id="pad" tabindex="0">
        <canvas class="pad-dots" id="padDots" aria-hidden="true"></canvas>
        <div class="handle shade-handle" id="hShade"></div>
        <div class="handle light-handle" id="hLight"></div>
        <div class="pad-tools">
          <button type="button" class="pad-button" id="shadeOff">−</button>
          <button type="button" class="pad-button" id="shadeOn">+</button>
        </div>
      </div>
      <div class="knobs">
        <div class="wave" id="wave" tabindex="0" role="slider" aria-valuemin="0" aria-valuemax="100"><svg width="190" height="48" viewBox="0 0 190 48" aria-hidden="true" id="waveSvg"></svg></div>
        <div class="dial" id="dial" tabindex="0" role="slider" aria-valuemin="0" aria-valuemax="100"><svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true" id="dialSvg"></svg></div>
      </div>
    </div></div>

    <div class="switches">
      <div class="switch-row">
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" class="line-icon" stroke-width="1.5"><circle cx="8" cy="8" r="2.9"/><path d="M12.9 8L14.8 8M11.46 11.46L12.81 12.81M8 12.9L8 14.8M4.54 11.46L3.19 12.81M3.1 8L1.2 8M4.54 4.54L3.19 3.19M8 3.1L8 1.2M11.46 4.54L12.81 3.19"/></svg>
        <span class="switch-title" id="followTitle" aria-hidden="true"></span>
        <button type="button" role="switch" class="switch" id="followSwitch"><span class="knob"></span></button>
      </div>
      <div class="switch-row" id="liveRow">
        <svg width="16" height="16" viewBox="0 0 18 18" aria-hidden="true" class="line-icon" stroke-width="1.6"><path d="M5.2 14h7.6a3.2 3.2 0 0 0 .4-6.4A4.6 4.6 0 0 0 4.4 8.6 2.7 2.7 0 0 0 5.2 14z"/></svg>
        <span class="switch-title" id="liveTitle" aria-hidden="true"></span>
        <span class="weather" id="weather"></span>
        <!-- live weather comes with stage 3: off, and it cannot be switched on yet -->
        <button type="button" role="switch" class="switch" id="liveSwitch" aria-disabled="true"><span class="knob"></span></button>
      </div>
    </div>
  </div>

  <!-- the settings take the whole card, the card keeps its height (design/panel/settings) -->
  <div class="settings" id="settings" hidden>
    <button type="button" class="back" id="settingsBack">
      <svg width="10" height="14" viewBox="0 0 10 14" aria-hidden="true" class="line-icon" stroke-width="1.7"><path d="M7 2 2 7l5 5"/></svg>
    </button>
    <div class="settings-rows">
      <div class="settings-row login-row">
        <span class="caption" id="loginTitle" aria-hidden="true"></span>
        <button type="button" role="switch" class="switch" id="loginSwitch"><span class="knob"></span></button>
      </div>
      <div class="line"></div>
      <div class="settings-group">
        <span class="caption" id="screensTitle"></span>
        <div class="halves" id="screensHalves" role="group">
          <button type="button" class="half" id="screensAll"></button>
          <button type="button" class="half" id="screensMain"></button>
        </div>
      </div>
      <div class="line" id="desktopsLine"></div>
      <div class="settings-group" id="desktopsGroup">
        <span class="caption" id="desktopsTitle"></span>
        <div class="halves" id="desktopsHalves" role="group">
          <button type="button" class="half" id="desktopsAll"></button>
          <button type="button" class="half" id="desktopsThis"></button>
        </div>
      </div>
    </div>
  </div>

  <div class="bottom" id="bottom">
    <button type="button" class="gear" id="gear">
      <svg width="11" height="11" viewBox="0 0 14 14" aria-hidden="true" class="line-icon soft" stroke-width="1.5"><path d="M13.12 5.50L13.12 8.50L11.29 8.92L11.39 8.68L12.39 10.27L10.27 12.39L8.68 11.39L8.92 11.29L8.50 13.12L5.50 13.12L5.08 11.29L5.32 11.39L3.73 12.39L1.61 10.27L2.61 8.68L2.71 8.92L0.88 8.50L0.88 5.50L2.71 5.08L2.61 5.32L1.61 3.73L3.73 1.61L5.32 2.61L5.08 2.71L5.50 0.88L8.50 0.88L8.92 2.71L8.68 2.61L10.27 1.61L12.39 3.73L11.39 5.32L11.29 5.08Z M9.1 7A2.1 2.1 0 1 1 4.9 7A2.1 2.1 0 1 1 9.1 7Z"/></svg>
    </button>
    <button type="button" class="quit" id="quit"></button>
  </div>
</section>
</div>
<script src="card.js"></script>
</body>
</html>

# Windows: build the app's MSIX package for the Microsoft Store (x64 and arm64 in one bundle, ci/package.ps1), install it
# on GitHub's Windows machines as the Store would and check everything there (Check/Program.cs, Check/Package.cs), and
# run Microsoft's Windows App Certification Kit on it. Results (pictures, report, journals) and the bundle for the Store
# are kept as the run's artifacts. A push runs the quick check; "[full]" in the commit message (or a manual run with mode
# full) adds the memory comparison of the four ways of keeping the web engine and ten minutes of the app's own
# measurements. "[compile]" in the commit message only builds the app on Linux (no Windows machines, no minutes spent).
# A manual run with mode "shots" takes only the Store's screenshots on the Windows 11 machine (Check/StoreShots.cs):
# no checks, no certification.
name: Windows

on:
  workflow_dispatch:
    inputs:
      mode:
        description: quick, full or shots
        default: full
  push:
    branches: [main, 'stage-*']
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'

# nothing here writes to the repository
permissions:
  contents: read

jobs:
  # a compile check on Linux first: cheap, and it stops a broken build before the Windows machines start
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Texts are the Mac app's
        run: python3 tools/check-strings.py
      - name: Build
        run: |
          dotnet build Hidamari -c Release -p:SkipStringsCheck=true
          dotnet build HidamariProbe -c Release
          dotnet build Check -c Release
      # the city search, time zones, MET's forecast and the weather's rules need no Windows (Tests/Program.cs)
      - name: Checks without Windows
        run: dotnet run --project Tests -c Release -- results-linux
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: check-linux
          path: results-linux
          retention-days: 5

  # the package for the Store: one bundle of x64 and arm64, not signed (the Store signs it); and a newer one, only for
  # the check of an update over the running app
  package:
    needs: compile
    if: ${{ !contains(github.event.head_commit.message, '[compile]') }}
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: The package for the Store
        shell: pwsh
        run: ci/package.ps1 -Version 1.1.0 -Out out/store
      - name: A newer package, for the update check only
        shell: pwsh
        run: ci/package.ps1 -Version 1.0.1 -Out out/update
      - uses: actions/upload-artifact@v5
        with:
          name: Hidamari-msix
          path: |
            out/store/*.msixbundle
            out/store/*.msix
          retention-days: 5
      - uses: actions/upload-artifact@v5
        with:
          name: update-test-msix
          path: out/update/*.msixbundle
          retention-days: 5

  # Microsoft's Windows App Certification Kit, as Partner Center runs it, on a copy signed for this run
  certification:
    needs: package
    if: ${{ inputs.mode != 'shots' }}
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/download-artifact@v5
        with:
          name: Hidamari-msix
          path: out/store
      - name: Windows App Certification Kit
        shell: pwsh
        run: ci/wack.ps1 (Get-ChildItem out/store/*.msixbundle).FullName results-wack
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: certification
          path: results-wack
          retention-days: 5

  check:
    needs: package
    if: ${{ inputs.mode != 'shots' }}
    strategy:
      fail-fast: false
      matrix:
        # windows-2025 (= windows-latest): Windows 11 24H2 code base; windows-2022: the Windows 10 / 11 21H2 code base;
        # windows-11-arm: Windows 11 on an ARM processor (free for open repositories)
        os: [windows-2025, windows-2022, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - uses: actions/download-artifact@v5
        with:
          name: Hidamari-msix
          path: out/store
      - uses: actions/download-artifact@v5
        with:
          name: update-test-msix
          path: out/update

      - name: Build the check and the probe
        shell: pwsh
        run: |
          $a = if ($env:PROCESSOR_ARCHITECTURE -eq 'ARM64') { 'arm64' } else { 'x64' }
          dotnet publish HidamariProbe -c Release -r "win-$a" -o out/probe
          dotnet build Check -c Release -o out/check
          Get-ChildItem out/store, out/update | Format-Table Name, Length

      - name: WebView2 runtime
        shell: pwsh
        run: ci/webview2.ps1

      - name: Sign copies for this machine only
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out/signed | Out-Null
          Copy-Item (Get-ChildItem out/store/*.msixbundle).FullName out/signed/store.msixbundle
          Copy-Item (Get-ChildItem out/update/*.msixbundle).FullName out/signed/update.msixbundle
          ci/sign-test.ps1 out/signed/store.msixbundle out/signed/update.msixbundle

      - name: Keep the wsl.exe prompt off the desktop
        shell: pwsh
        run: ci/quiet-wsl.ps1

      - name: Install the package and check it
        shell: pwsh
        env:
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (contains(github.event.head_commit.message, '[full]') && 'full' || 'quick') }}
        run: out/check/Check.exe package out/signed/store.msixbundle out/signed/update.msixbundle out/probe/HidamariProbe.exe results $env:MODE

      - name: Collect journals
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force results/journals | Out-Null
          Get-ChildItem "$env:LOCALAPPDATA\Packages\EdTsarionov.Hidamari_*\LocalState\*.log" -ErrorAction SilentlyContinue | Copy-Item -Destination results/journals
          Copy-Item "$env:LOCALAPPDATA\HidamariProbe\probe.log" results/journals -ErrorAction SilentlyContinue
          if (Test-Path results/report.md) { Get-Content results/report.md | Out-String | Add-Content $env:GITHUB_STEP_SUMMARY }

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: check-${{ matrix.os }}
          path: results
          retention-days: 5

  # the Store's screenshots: the real desktop of the Windows 11 machine with the installed package running
  shots:
    needs: package
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'shots' }}
    runs-on: windows-11-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@v5
        with:
          name: Hidamari-msix
          path: out/store
      - name: Build the check
        shell: pwsh
        run: dotnet build Check -c Release -o out/check
      - name: WebView2 runtime
        shell: pwsh
        run: ci/webview2.ps1
      - name: Sign a copy for this machine only
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out/signed | Out-Null
          Copy-Item (Get-ChildItem out/store/*.msixbundle).FullName out/signed/store.msixbundle
          ci/sign-test.ps1 out/signed/store.msixbundle
      - name: Keep the wsl.exe prompt off the desktop
        shell: pwsh
        run: ci/quiet-wsl.ps1
      - name: The Store's screenshots
        shell: pwsh
        run: out/check/Check.exe store-shots out/signed/store.msixbundle results
      - name: Collect the journal
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force results/journals | Out-Null
          Get-ChildItem "$env:LOCALAPPDATA\Packages\EdTsarionov.Hidamari_*\LocalState\*.log" -ErrorAction SilentlyContinue | Copy-Item -Destination results/journals
          if (Test-Path results/report.md) { Get-Content results/report.md | Out-String | Add-Content $env:GITHUB_STEP_SUMMARY }
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: store-shots
          path: results
          retention-days: 5
